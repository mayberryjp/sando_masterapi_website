[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sando-masterapi"
version = "0.1.0"
description = "Error reports dashboard API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "bottle>=0.13",
  "waitress>=3.0",
  "SQLAlchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "webtest>=3",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sando_masterapi" = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bottle", "waitress"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sando_masterapi.api.*"]
disallow_untyped_decorators = false
